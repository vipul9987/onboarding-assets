<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScopeLock | Client Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#0D0D0D', // Main Background (from plate)
                surface: '#1A1A1A', // Card Background (from plate)
                accent: '#4ADE80', // Main Neon Green (from plate)
                secondary: '#0F2C1A', // Deep Green (from plate)
                success: '#4ADE80', // Success Green
                border: '#333333', // Border Gray (from plate)
                'dark-green': '#07160D', // Extra Dark Green (from plate)
              },
              slate: {
                850: '#151f32',
                900: '#0f172a',
                950: '#020617',
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'pulse-glow': 'pulseGlow 2s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 5px rgba(74, 222, 128, 0.2)' },
                '50%': { boxShadow: '0 0 20px rgba(74, 222, 128, 0.5)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0D0D0D; color: #f8fafc; }
      
      /* Modern Glass Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(74, 222, 128, 0.5); }
      
      .glass-panel {
        background: rgba(26, 26, 26, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .neon-text {
        text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
      }
    </style>
